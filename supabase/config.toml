# Supabase project configuration (functions deploy settings).
project_id = "glowi"

# auth-signup is a pre-auth endpoint (guest/email account creation via admin
# API); it is protected by the platform anon-key requirement instead of a JWT.
[functions.auth-signup]
verify_jwt = false

[functions.analyze-skin]
verify_jwt = true

[functions.chat]
verify_jwt = true

[functions.extract-memories]
verify_jwt = true

[functions.skin-forecast]
verify_jwt = true

[functions.identify-product]
verify_jwt = true

[functions.check-conflicts]
verify_jwt = true

[functions.compare-scans]
verify_jwt = true

[functions.compare-products]
verify_jwt = true

[functions.glow-report]
verify_jwt = true

# push-dispatch is cron-called via pg_net with a shared secret header (ADR-0015);
# there is no user JWT on that path.
[functions.push-dispatch]
verify_jwt = false

# cleanup-guests shares push-dispatch's cron identity (same secret header).
[functions.cleanup-guests]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
