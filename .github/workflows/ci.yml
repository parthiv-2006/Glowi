name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile · typecheck · lint · format · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci

  # The edge functions are TypeScript that CI never looked at: a type error in any of
  # them merged green and only surfaced at deploy time, or worse, at runtime in front
  # of a user. Deno is their actual runtime, so Deno is what has to typecheck them.
  edge-functions:
    name: Edge functions · deno check · deno test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      # Every function entrypoint plus every shared module — _shared/*.ts is checked
      # explicitly because a module imported by nothing (yet) still has to compile.
      - name: Typecheck
        run: deno check functions/*/index.ts functions/_shared/*.ts

      # --allow-env because anthropic.ts and http.ts read their config from the
      # environment at import time. Nothing else is granted: these are pure-logic
      # tests and must not be able to reach the network or the disk.
      - name: Unit tests
        run: deno test --allow-env functions/_shared/__tests__/
